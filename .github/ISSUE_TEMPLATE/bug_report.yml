name: Bug report
description: Something else does not work (display, menu, updates, installer...).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: BatteryHub version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2. Mention taskbar tools (Windhawk, ExplorerPatcher...) if you use any.
